<html lang="it">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: il mondo 3D riempie lo schermo; sopra galleggiano una testata, le etichette degli agenti e una scheda in basso. */
  :root {
    color-scheme: light;
    --ink: #1B2A2E;
    --paper: #FBFAF4;
    --line: #E3E0D4;
    --muted: #5F6B6B;
    --accent: #D8482F;
    --sea: #2BA9BE;
    --font-ui: "Rubik", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--sea); color: var(--ink); font: 15px/1.45 var(--font-ui); overflow: hidden; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #world:active { cursor: grabbing; }

  .hud { position: fixed; left: 16px; right: 16px; top: 14px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; pointer-events: none; }

  .brand { display: grid; gap: 5px; padding: 7px 8px 8px 10px; border-radius: 14px; background: rgba(251, 250, 244, .74); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 2px 10px rgba(20, 40, 50, .10); }

  .icons { display: flex; gap: 4px; }
  .ico { position: relative; height: 30px; min-width: 30px; padding: 0 6px; gap: 3px; justify-content: center; border: 0; border-radius: 9px; background: rgba(255, 255, 255, .45); color: var(--ink); font: 500 11px var(--font-mono); }

  .ico[aria-pressed="true"], .ico.open { background: rgba(27, 42, 46, .85); color: var(--paper); }
  .ico.manual::after { content: ""; position: absolute; right: 3px; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .ico .badge { position: absolute; top: -4px; right: -4px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: #fff; font: 700 9.5px/15px var(--font-ui); text-align: center; }
  .pop { position: fixed; left: 16px; top: 92px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 32px); padding: 6px; border-radius: 14px; background: rgba(251, 250, 244, .82); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 4px 14px rgba(20, 40, 50, .14); }
  .pop button { display: grid; justify-items: center; gap: 2px; width: 54px; padding: 6px 2px 4px; border: 0; border-radius: 10px; background: transparent; font: 10px var(--font-ui); color: var(--muted); }
  .pop button svg { width: 20px; height: 20px; color: var(--ink); }
  .pop button[aria-pressed="true"] { background: rgba(27, 42, 46, .85); color: var(--paper); }
  .pop button[aria-pressed="true"] svg { color: var(--paper); }
  .brand p { margin: 0; font: 11px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .right > button { font-size: 13px; padding: 6px 12px; }
  .nav { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); display: grid; gap: 6px; }
  .nav button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .nav button { width: 40px; height: 40px; padding: 0; justify-content: center; font-size: 19px; line-height: 1; border-radius: 12px; background: rgba(251, 250, 244, .86); box-shadow: 0 3px 10px rgba(20, 40, 50, .14); }
  .right { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  button, .btn { font: 500 14px var(--font-ui); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn.off { color: var(--muted); border-style: dashed; cursor: default; }
  .right > button { box-shadow: 0 6px 18px rgba(20, 40, 50, .16); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
  .dot.calm { background: #4FA36B; }

  .panel { position: fixed; right: 16px; top: 76px; width: min(360px, calc(100% - 32px)); max-height: calc(100% - 100px); overflow: auto; display: grid; gap: 12px; }
  .panel h2, .card h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .group { display: grid; gap: 6px; }
  .group > span { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 11px; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .note { margin: 0; font-size: 12.5px; color: var(--muted); }

  .tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; pointer-events: auto; padding: 1px 7px; font-size: 11px; gap: 4px; background: rgba(251, 250, 244, .55); border-color: transparent; box-shadow: none; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); white-space: nowrap; will-change: transform; }
  .tag .dot { display: none; }
  .tag.quiet { opacity: .8; }
  .tag.lit { opacity: 1; background: rgba(251, 250, 244, .9); border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 12px 2px var(--c); animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 1px var(--c), 0 0 4px 0 var(--c); } }
  @media (prefers-reduced-motion: reduce) { .tag.lit { animation: none; } }
  .tags.far .tag .app { display: none; }
  .tags.far .tag { padding: 0 6px; font-size: 10px; }
  .hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); font-size: 12.5px; padding: 6px 12px; border-radius: 999px; background: rgba(27, 42, 46, .78); color: #FBFAF4; pointer-events: none; transition: opacity .6s; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }

  .card { position: fixed; left: 16px; bottom: 16px; width: min(420px, calc(100% - 32px)); max-height: calc(100% - 110px); overflow: auto; display: grid; gap: 10px; padding: 14px 16px 16px; }
  .card header { display: flex; gap: 12px; align-items: center; }
  .swatch { width: 38px; height: 38px; border-radius: 12px; flex: none; border: 1px solid rgba(0, 0, 0, .12); }
  .card header div { min-width: 0; flex: 1; }
  .card small { color: var(--muted); font-size: 12.5px; }
  .close { padding: 6px 11px; }
  .msg { margin: 0; padding: 10px 12px; background: #F1EFE5; border-radius: 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .badge { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .inbox { display: grid; gap: 6px; }
  .inbox button { border-radius: 12px; text-align: left; align-items: flex-start; display: grid; gap: 2px; padding: 8px 12px; }
  .inbox b { font-weight: 500; }
  .inbox span { font-weight: 400; font-size: 13px; color: var(--muted); }
  .ask { display: flex; gap: 8px; }
  .ask input { flex: 1; min-width: 0; font: 14px var(--font-ui); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; }
  [hidden] { display: none !important; }
  .fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
</style>
</head>
<body>
<canvas id="world" aria-label="CAM World: isola 3D con gli agenti"></canvas>
<div class="tags" id="tags"></div>

<div class="hud">
  <div class="brand" id="brand">
    <button class="title" id="homeBtn" type="button" title="Torna alla vista intera">CAM World</button>
    <div class="icons" role="toolbar" aria-label="Menu di CAM World">
      <button class="ico" id="iMayor" type="button" title="Il Sindaco"></button>
      <button class="ico" id="iTime" type="button" title="Ora" aria-haspopup="true"></button>
      <button class="ico" id="iWx" type="button" title="Meteo" aria-haspopup="true"></button>
      <button class="ico" id="iSeason" type="button" title="Stagione" aria-haspopup="true"></button>
      <button class="ico" id="iFest" type="button" title="Festa" aria-haspopup="true"></button>
      <button class="ico" id="sndBtn" type="button" title="Suoni" aria-pressed="false"></button>
    </div>
  </div>
</div>
<div class="pop" id="pop" hidden></div>


<section class="plate card" id="card" hidden aria-live="polite"></section>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  ];

  var LA = -2.78, LD = coast(LA) + 6.8, LIGHT = { x: Math.cos(LA) * LD, z: Math.sin(LA) * LD, r: 1.25, h: 1.2, islet: true };
  var POND = { x: 0.5, z: 17.5, r: 1.9, level: 0.72 };

  var STREAM = [[-0.5, -16.5, 0.74], [0.0, -18.3, 0.68], [0.6, -19.0, 0.6], [0.6, -23.6, 0.6], [0.9, -25.6, 0.3], [0.4, -27.6, 0.02], [0.3, -29.5, -0.3]];

  // ===================== TEMPO E STAGIONI =====================

  }
  function solar(date) { // formule NOAA

  }
