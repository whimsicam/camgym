<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CAM World">
<meta name="theme-color" content="#2BA9BE">
<title>CAM World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: il mondo 3D riempie lo schermo; sopra galleggiano una testata, le etichette degli agenti e una scheda in basso. */
  :root {
    color-scheme: light;
    --ink: #1B2A2E;
    --paper: #FBFAF4;
    --line: #E3E0D4;
    --muted: #5F6B6B;
    --accent: #D8482F;
    --sea: #2BA9BE;
    --font-ui: "Rubik", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--sea); color: var(--ink); font: 15px/1.45 var(--font-ui); overflow: hidden; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #world:active { cursor: grabbing; }

  .hud { position: fixed; left: 16px; right: 16px; top: 14px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .plate { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; box-shadow: 0 6px 18px rgba(20, 40, 50, .16); }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; font: 12.5px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .right { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  button, .btn { font: 500 14px var(--font-ui); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn.off { color: var(--muted); border-style: dashed; cursor: default; }
  .right > button { box-shadow: 0 6px 18px rgba(20, 40, 50, .16); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
  .dot.calm { background: #4FA36B; }

  .panel { position: fixed; right: 16px; top: 76px; width: min(360px, calc(100% - 32px)); max-height: calc(100% - 100px); overflow: auto; display: grid; gap: 12px; }
  .panel h2, .card h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .group { display: grid; gap: 6px; }
  .group > span { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 11px; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .note { margin: 0; font-size: 12.5px; color: var(--muted); }

  .tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; pointer-events: auto; padding: 3px 9px; font-size: 12px; gap: 6px; box-shadow: 0 3px 10px rgba(20, 40, 50, .18); white-space: nowrap; will-change: transform; }
  .tag .dot { width: 7px; height: 7px; }
  .tag.quiet { opacity: .88; }
  .tags.far .tag .app { display: none; }
  .tags.far .tag { padding: 2px 7px; font-size: 11px; }

  .card { position: fixed; left: 16px; bottom: 16px; width: min(420px, calc(100% - 32px)); max-height: calc(100% - 110px); overflow: auto; display: grid; gap: 10px; padding: 14px 16px 16px; }
  .card header { display: flex; gap: 12px; align-items: center; }
  .swatch { width: 38px; height: 38px; border-radius: 12px; flex: none; border: 1px solid rgba(0, 0, 0, .12); }
  .card header div { min-width: 0; flex: 1; }
  .card small { color: var(--muted); font-size: 12.5px; }
  .close { padding: 6px 11px; }
  .msg { margin: 0; padding: 10px 12px; background: #F1EFE5; border-radius: 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .badge { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .inbox { display: grid; gap: 6px; }
  .inbox button { border-radius: 12px; text-align: left; align-items: flex-start; display: grid; gap: 2px; padding: 8px 12px; }
  .inbox b { font-weight: 500; }
  .inbox span { font-weight: 400; font-size: 13px; color: var(--muted); }
  .ask { display: flex; gap: 8px; }
  .ask input { flex: 1; min-width: 0; font: 14px var(--font-ui); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; }
  [hidden] { display: none !important; }
  .fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
</style>
</head>
<body>
<canvas id="world" aria-label="CAM World: isola 3D con gli agenti"></canvas>
<div class="tags" id="tags"></div>

<div class="hud">
  <div class="plate brand">
    <h1>CAM World</h1>
    <p id="status">Milano</p>
  </div>
  <div class="right">
    <button id="mayorPill" type="button"><span class="dot" id="mayorDot"></span><span id="mayorText">Il Sindaco</span></button>
    <button id="homeBtn" type="button">Vista intera</button>
    <button id="tuneBtn" type="button" aria-expanded="false" aria-controls="tune">Ora, meteo, stagione</button>
  </div>
</div>

<section class="plate panel" id="tune" hidden>
  <h2>Ora, meteo, stagione</h2>
  <div class="group" role="group" aria-label="Ora"><span>Ora</span><div class="chips" id="cTime"></div></div>
  <div class="group" role="group" aria-label="Meteo"><span>Meteo</span><div class="chips" id="cWx"></div></div>
  <div class="group" role="group" aria-label="Stagione"><span>Stagione</span><div class="chips" id="cSeason"></div></div>
  <p class="note" id="wxNote"></p>
</section>

<section class="plate card" id="card" hidden aria-live="polite"></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
